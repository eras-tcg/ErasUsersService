spring.config.import=optional:file:users_service/.env[.properties],optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

# MongoDB configuration
spring.mongodb.uri=${SPRING_MONGODB_URI}

# API CONFIGURATION
user.can-delete-own-account=${USER_CAN_DELETE_OWN_ACCOUNT}
user.username.min-length=${USER_USERNAME_MIN_LENGTH}
user.username.max-length=${USER_USERNAME_MAX_LENGTH}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Behind CloudFront + nginx: trust X-Forwarded-Proto/For from the proxy so the site's own calls (https://erastcg.com,
# www, staging) count as same-origin and never depend on CORS_ALLOWED_ORIGINS; other origins are still checked.
server.forward-headers-strategy=native
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# The Android app (Capacitor: its page is served at https://localhost) signs in by the API's full address; always allowed
cors.app-origins=${CORS_APP_ORIGINS:https://localhost}

roles.base-username=${ROLES_BASE_USERNAME}
roles.base-password=${ROLES_BASE_PASSWORD}
roles.base-email=${ROLES_BASE_EMAIL}

# Roles

roles.allowed=${ROLES_ALLOWED}
roles.base-role=${ROLES_BASE_ROLE}

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Verification
verification.base-url=${VERIFICATION_BASE_URL}