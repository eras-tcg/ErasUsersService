# Build on GitHub, publish to GHCR, deploy with eras-tcg/infra (self-hosted runner in the VPS).
#   PR to develop/main -> tests + build only
#   push to develop    -> build + push + deploy staging
#   push to main       -> build + push + deploy production (waits for approval)
#   Run workflow       -> redeploy an existing image (rollback)
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Commit sha of an image already published (see a previous run)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      SPRING_MONGODB_URI: "mongodb://localhost:27017/eras_test"
      SPRING_APPLICATION_NAME: "users_service"
      SERVER_PORT: "0"
      JWT_SECRET: "test-only-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_EXPIRATION: "86400000"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      ROLES_ALLOWED: "true"
      ROLES_BASE_ROLE: "DEVELOPER"
      ROLES_BASE_USERNAME: "admin"
      ROLES_BASE_PASSWORD: "Test-only-1!"
      ROLES_BASE_EMAIL: "admin@example.com"
      SPRING_MAIL_HOST: "localhost"
      SPRING_MAIL_PORT: "2525"
      SPRING_MAIL_USERNAME: "test@example.com"
      SPRING_MAIL_PASSWORD: "test"
      USER_CAN_DELETE_OWN_ACCOUNT: "false"
      USER_USERNAME_MIN_LENGTH: "3"
      USER_USERNAME_MAX_LENGTH: "20"
      USER_PASSWORD_MIN_LENGTH: "8"
      USER_PASSWORD_MAX_LENGTH: "64"
      USER_PASSWORD_HAS_UPPERCASE: "true"
      USER_PASSWORD_HAS_LOWERCASE: "true"
      USER_PASSWORD_HAS_DIGIT: "true"
      USER_PASSWORD_HAS_SPECIAL: "true"
      USER_PASSWORD_SPECIAL_CHARS: "!@#$%^&*"
      VERIFICATION_BASE_URL: "http://localhost:5173/validate"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests (dummy config, throwaway MongoDB)
        working-directory: users_service
        run: mvn -B -ntp verify

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/eras-tcg/users-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on develop/main)
        uses: docker/build-push-action@v6
        with:
          context: ./users_service
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/eras-tcg/users-service:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: users-service
      environment: staging
      image: ${{ needs.build.outputs.image }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: users-service
      environment: production
      image: ${{ needs.build.outputs.image }}

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    uses: eras-tcg/infra/.github/workflows/deploy.yml@main
    with:
      service: users-service
      environment: ${{ inputs.environment }}
      image: ghcr.io/eras-tcg/users-service:${{ inputs.image_tag }}
